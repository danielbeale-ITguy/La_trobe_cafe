<!DOCTYPE html>


<html>
<head>
<link rel="stylesheet" href="style.css" />



</head>


<body class="body">


<h1 class="main_title_page">Make a Booking</h1>

<div class="link_container">
    <a href="index.html" class="page_link">Home</a>
</div>
<br>


    <form action="/register" method="POST">
    <label for="firstname">First name:</label><br>
    <input type="text" id="firstname" name="firstname"><br>
    <label for="lastname">Last name:</label><br>
    <input type="text" id="lastname" name="lastname"><br>
    <p>Date:</p>
    <input type="date" name="date" id="date"><br>
    <p>Time</p>
    <input type="time" name="time" id="time"><br>
    <div>
    <p>Number of Guests:</p>

    <div class="guest-grid">
    <label><input type="radio" name="numberG" value="1">1</label>
    <label><input type="radio" name="numberG" value="2">2</label>
    <label><input type="radio" name="numberG" value="3">3</label>
    <label><input type="radio" name="numberG" value="4">4</label>
    <label><input type="radio" name="numberG" value="5">5</label>
    <label><input type="radio" name="numberG" value="6">6</label>
    <label><input type="radio" name="numberG" value="7">7</label>
    <label><input type="radio" name="numberG" value="8">8</label>
    <label><input type="radio" name="numberG" value="9">9</label>
    </div>
    <p>No bookings larger than 9</p>
    </div>
    <p>Opptional Pre orders</p>   
        <select name="preo" id="preo" size="1">
        <option value="None">None</option>
        <option value="Chocalate Cake">Chocalate Cake</option>
        <option value="Cheese Cake">Cheese Cake</option>
        <option value="Carrot Cake">Carrot Cake</option>
        <option value="Red Velvet Cake">Red Velvet Cake</option>
            </select>   
    <p>Special Offers: </p>   
        <select name="dicount" id="discount" size="1">
        <option value="None">None</option>
        <option value="Early bird discount">Early Bird discount: before 6am</option>
        <option value="Student discount">Student discount</option>
        <option value="Staff discount">Staff discount</option>


        </select>    
        <br>
        <input type="submit" value="submit">    
</form>





</body>





</html>
